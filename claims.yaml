- id: s11-m8-half
  kind: interpretation
  passage: 'The loss rises monotonically and faster than linearly with the markup: at a markup of 8 finance
    takes more than half the budget and viability falls by 25.1 percent.'
  rationale: 'Summary of stored values: at markup 8 the finance share is 0.521 (/distortion_sweep/6/finance_share),
    i.e. more than half; the loss sequence 0, 0.15, 0.52, 1.65, 4.67, 11.59, 25.13 percent over markups
    0-8 (/distortion_sweep) is increasing and convex.'
- id: s11-by-construction
  kind: interpretation
  passage: 'This identity holds by construction: with all prices equal to 1 the faithful coordinator maximizes
    the same objective as the constraint coordinator, so the two must return the same allocation.'
  rationale: 'Analytic: with all prices 1 the faithful objective equals the constraint objective, so the
    allocations coincide; the stored divergence 0.0 confirms it numerically.'
- id: s11-not-measurement
  kind: interpretation
  passage: These numbers describe the model's geometry and measure no actual economy.
  rationale: States the evidential scope of the model results.
- id: s11-assume-weight
  kind: assumption
  passage: Finance has a low true weight, stipulated at 0.30, on the assumption that it coordinates claims
    and does not itself sustain the system.
  rationale: The low weight on finance is a stipulation; the text notes that a markup on a high-weight
    sector would not appear as waste in the same way.
- id: s11-assume-omniscient
  kind: assumption
  passage: It assumes the full-information optimum as a reference point to show what an undistorted objective
    would yield, and it says nothing about whether any real planner, market, or computation could discover
    that optimum from dispersed and tacit knowledge.
  rationale: The optimum is computed with full knowledge of true weights, the planner that Hayek and Mises
    argue cannot exist; the model says nothing about discovering it.
- id: def-economicity
  kind: definition
  passage: A relation becomes economy-like when constrained flows are recurrently allocated under a value
    frame and a stabilizing mechanism, which may be metabolism, habit, kinship, ritual, law, fiscal administration,
    money, platform code, or ecological governance.
  rationale: Stipulative definition of economicity used to order the chain from constraint to price.
- id: def-transaction
  kind: definition
  passage: In this broad sense a transaction is a state-changing coupling between systems.
  rationale: Stipulative broad definition that makes monetary exchange a special case.
- id: interp-price-late
  kind: interpretation
  passage: Price can exist without a market, and value without a price.
  rationale: Conclusion from the blood-compensation and gift cases of sections 5 and 6.
- id: interp-after-economy
  kind: interpretation
  passage: 'The defensible claim is narrow: monetary price is losing its monopoly as the public interface
    of value, and other allocation regimes are becoming explicit.'
  rationale: Central thesis stated in its narrow form.
- id: normative-two-paths
  kind: normative
  passage: The phrase "after economy" therefore names a choice between two paths.
  rationale: Normative framing of the two institutional paths; not an empirical prediction.
- id: molenaar-allocation
  kind: source
  passage: A bacterium under nutrient stress shifts gene expression, metabolism, and repair in ways that
    can be modeled as resource allocation [@molenaar2009; @scott2010].
  evidence:
    citation_id: molenaar2009
    locator: Abstract
    verified: true
    verification_note: DOI 10.1038/msb.2009.82; the abstract (OpenAlex) models growth-rate-dependent regulation
      of cell size, ribosomal content and metabolic efficiency as the outcome of optimising a self-replicating
      system, i.e. a resource-allocation model. Scott et al. 2010 (DOI 10.1126/science.1192588) similarly
      relate ribosome abundance to growth rate.
- id: mitchell-economy
  kind: source
  passage: The modern economy as a bounded macro-object is much later and depends on statistics, national
    accounting, and policy expertise, as @mitchell1998 argues for the twentieth century.
  evidence:
    citation_id: mitchell1998
    locator: Abstract
    verified: true
    verification_note: DOI 10.1080/095023898335627; the abstract (OpenAlex) states that the understanding
      of "the economy" as the totality of production, distribution and consumption within a country arose
      in a mid-twentieth-century crisis of economic representation.
- id: ostrom-commons
  kind: source
  passage: Public provisioning can decommodify some necessities, and commons can be governed durably outside
    both state and market [@ostrom1990].
  evidence:
    citation_id: ostrom1990
    locator: Abstract
    verified: true
    verification_note: DOI 10.1017/CBO9780511807763; the abstract (OpenAlex) states that neither state
      nor market has been uniformly successful with common-pool resources and that such problems are sometimes
      solved by voluntary organisations.

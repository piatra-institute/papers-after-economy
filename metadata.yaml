abstract: 'Price is a late institutional interface, a form of commensuration that appears after value
  has already become consequential. We trace a sequence that runs through constraint, flow, cost, allocation,
  binding relation, valuation, commensuration, price, money, market, capital, and financial abstraction.
  Physical systems supply gradients and dissipation, to which economic language applies only by analogy.
  Cells allocate energy, metabolites, membrane gradients, and repair capacity under viability constraints
  and incur costs and tradeoffs without prices. Organisms budget across energy, attention, immune response,
  movement, and reproduction, and sensorimotor coupling, such as a catcher intercepting a ball, is transaction
  without exchange. Human institutions stabilize these older structures: gifts create debt without money,
  blood compensation creates price without markets, and states fiscalize grain, land, labor, and debt
  before capitalism. Capitalism subordinates value, money, markets, and price to accumulation, and financialization
  prices claims on future income, risk, collateral, and state rescue. "After economy" is defensible only
  in a narrow sense, as the loss by monetary price of its monopoly over the public interpretation of value;
  computation, platforms, ecological accounting, and public provisioning shift allocation into compute,
  attention, energy, access, and governance without removing it. A stylized six-sector allocation model
  illustrates the structure: undistorted prices reproduce the constraint optimum by construction, while
  a markup of 3 on finance raises its budget share from 0.02 to 0.26 and lowers total viability by 8.08
  percent. These figures describe the model''s geometry and do not measure any real economy.'
web_blurb: Traces price back through commensuration, valuation, allocation, and constraint, from cellular
  cost to gift debt, blood compensation, fiscal states, and finance; in a six-sector model, a finance
  price markup of 3 costs 8.08 percent of viability.
